<!-- @dsCard group="Surfaces" height=420 subtitle="Colour blocks" -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 24px; background: var(--surface); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; }
</style>
<div id="root"></div>
<script>
  var H = window.Halba, e = React.createElement;
  var tones = ['brand', 'brand-tint', 'sky-tint', 'sky', 'sun', 'accent', 'ink', 'sunken'];
  ReactDOM.createRoot(document.getElementById('root')).render(
    e('div', { className: 'grid' }, tones.map(function (t) {
      return e(H.Panel, { key: t, tone: t }, e('div', { style: { fontFamily: 'var(--font-mono)', fontSize: 12, letterSpacing: '0.08em', textTransform: 'uppercase' } }, t), e('div', { style: { marginTop: 24 } }, e(H.TextLink, { href: '#', withArrow: true }, 'Learn more')));
    }))
  );
</script>
