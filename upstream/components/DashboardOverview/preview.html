<!-- @dsCard group="Dashboard" height=1180 subtitle="Overview: fluid metrics, decline reasons as a donut, SCA as a share bar, short table" -->
<style>body{margin:0;padding:24px;background:var(--surface);font-family:var(--font-sans);color:var(--ink)}
.dash{display:grid;gap:24px;max-width:1100px}.dash h1{margin:0;font:600 28px/34px var(--font-sans);letter-spacing:-.02em}.sub{margin:4px 0 0;color:var(--ink-muted);font:400 15px/22px var(--font-sans)}
.sec{background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;display:grid;gap:16px;box-shadow:var(--shadow-card);min-width:0}
.sec h2{margin:0;font:600 18px/24px var(--font-sans)}.sec .hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 24px;margin:0;font:400 14px/20px var(--font-sans)}.kv dt{color:var(--ink-muted)}.kv dd{margin:0;font-family:var(--font-mono);text-align:right}
.frame{position:relative;height:720px;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;background:var(--surface)}.frame>.in{padding:24px}
.lab{font:500 12px/16px var(--font-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 8px}
