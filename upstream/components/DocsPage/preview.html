<!-- @dsCard group="Pages" height=900 subtitle="Reference page for an endpoint" -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 0; background: var(--surface); font-family: var(--font-sans); color: var(--ink); }
  .cap { font: 500 12px/16px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 12px; }
  .stack { display: flex; flex-direction: column; gap: 28px; max-width: 720px; }
</style>
<div id="root"></div>
<script>
  var H = window.Halba, e = React.createElement;

  var curl = 'curl https://api.halba.ai/v1/payments \\\n  -H "Authorization: Bearer sk_test_..." \\\n  -H "Idempotency-Key: 8f1c-2e90" \\\n  -d amount=4990 \\\n  -d currency=eur \\\n  -d payment_method=pm_card_visa';
  var node = "import Halba from 'halba';\n\nconst halba = new Halba('sk_test_...');\nconst payment = await halba.payments.create({\n  amount: 4990,\n  currency: 'eur',\n  payment_method: 'pm_card_visa'\n}, { idempotencyKey: '8f1c-2e90' });";
  var py = "import halba\n\nhalba.api_key = 'sk_test_...'\npayment = halba.Payment.create(\n    amount=4990,\n    currency='eur',\n    payment_method='pm_card_visa',\n)";
  var json = '{\n  "id": "pay_1Nq8",\n  "object": "payment",\n  "status": "authorized",\n  "amount": 4990,\n  "currency": "eur",\n  "authentication": { "type": "exemption", "result": "frictionless" },\n  "route": { "psp": "backup", "attempts": 2 }\n}';
  var nav = [
    { title: 'Get started', items: [{ label: 'Introduction', href: '#' }, { label: 'Quickstart', href: '#' }, { label: 'Test cards', href: '#' }] },
    { title: 'Payments', items: [{ label: 'Create a payment', href: '#', current: true }, { label: 'Capture', href: '#' }, { label: 'Refund', href: '#' }, { label: 'Retrieve', href: '#' }] },
    { title: 'Guides', items: [{ label: 'Routing and fallback', href: '#' }, { label: '3D Secure', href: '#' }, { label: 'Webhooks', href: '#' }] }
  ];
  var toc = [{ label: 'Request', href: '#request', current: true }, { label: 'Parameters', href: '#parameters' }, { label: 'Response', href: '#response' }, { label: 'Errors', href: '#errors' }];
  var params = [
    { name: 'amount', type: 'integer', req: 'required', desc: 'Amount in minor units, for example 4990 for EUR 49.90.' },
    { name: 'currency', type: 'string', req: 'required', desc: 'Three-letter ISO code in lowercase.' },
    { name: 'payment_method', type: 'string', req: 'required', desc: 'Id of a tokenised method created by halba.js.' },
    { name: 'capture', type: 'boolean', req: 'optional', desc: 'Capture at once. Default true.' },
    { name: 'metadata', type: 'object', req: 'optional', desc: 'Up to 20 key-value pairs, returned in every event.' }
  ];
  var errs = [
    { code: 'card_declined', status: '402', desc: 'The issuer declined. Halba already tried the backup route when one is set.' },
    { code: 'authentication_required', status: '402', desc: 'The customer must complete 3D Secure; use the returned next_action.' },
    { code: 'idempotency_conflict', status: '409', desc: 'The key was used with different parameters.' }
  ];
  function Page() {
    var s = React.useState('curl'), tab = s[0], setTab = s[1];
    var key = React.useState('test'), mode = key[0], setMode = key[1];
    return e(H.DocsLayout, { section: 'Docs', nav: nav, toc: toc,
      search: e(H.DocsSearch, null),
      tools: e(H.SegmentedControl, { label: 'Environment', value: mode, onChange: setMode, options: [{ value: 'test', label: 'Test' }, { value: 'live', label: 'Live' }] }) },
      e(H.DocsHeader, { breadcrumb: [{ label: 'API reference', href: '#' }, { label: 'Payments', href: '#' }, { label: 'Create' }], title: 'Create a payment', lead: 'Authorize a payment in one call. Halba screens for fraud, asks for 3D Secure only when it pays off and falls back to a backup PSP if the first one declines.' },
        e(H.Endpoint, { method: 'POST', path: '/v1/payments' })),
      e('h2', { id: 'request' }, 'Request'),
      e('p', null, 'Authenticate with your secret key and send an ', e('code', null, 'Idempotency-Key'), ' so a retry never charges twice.'),
      e(H.CodeBlock, { label: 'Language', tabs: [{ label: 'cURL', code: curl }, { label: 'Node.js', code: node }, { label: 'Python', code: py }] }),
      e(H.Callout, { tone: 'warning' }, e('p', null, mode === 'live' ? 'You are using live keys: this call moves real money.' : 'Test keys never move money. Switch to Live only when your integration passes in the sandbox.')),
      e('h2', { id: 'parameters' }, 'Parameters'),
      e(H.Table, { label: 'Parameters', caption: 'Parameters of POST /v1/payments', columns: [{ key: 'name', label: 'Parameter', mono: true, header: true, width: '26%' }, { key: 'type', label: 'Type', mono: true, width: '14%' }, { key: 'req', label: 'Required', width: '14%' }, { key: 'desc', label: 'Description' }], rows: params }),
      e('h2', { id: 'response' }, 'Response'),
      e('p', null, 'A ', e('code', null, 'payment'), ' object. The ', e('code', null, 'route'), ' field shows which PSP approved it and how many attempts it took.'),
      e(H.CodeBlock, { title: 'Response 201', code: json }),
      e('h2', { id: 'errors' }, 'Errors'),
      e(H.Table, { label: 'Errors', caption: 'Errors of POST /v1/payments', columns: [{ key: 'code', label: 'Code', mono: true, header: true, width: '30%' }, { key: 'status', label: 'HTTP', mono: true, width: '12%' }, { key: 'desc', label: 'Meaning' }], rows: errs }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(e(Page));
</script>
