<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 24px; background: var(--surface); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; }
</style>
<div id="root"></div>
<script>
  var H = window.Halba, e = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    e('div', { className: 'grid' },
      e(H.MetricCard, { label: 'Approval rate', value: '94.6%', delta: '+2.8pp', trend: 'good', series: [88, 89, 90, 90, 92, 93, 94.6] }),
      e(H.MetricCard, { label: 'Decline rate', value: '9.4%', delta: '+6.2pp', trend: 'bad', series: [3, 3.2, 3.1, 3.6, 4, 9.4, 5.2] }),
      e(H.MetricCard, { label: 'Fees by processor', value: 'GBP 1,350', delta: 'Flat', trend: 'flat' }))
  );
</script>
