<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 24px; background: var(--surface); font-family: var(--font-sans); }
  .stage { position: relative; height: 330px; margin-bottom: 24px; border-radius: var(--radius-lg); background: var(--surface-sunken); overflow: hidden; }
</style>
<div id="root"></div>
<script>
  var H = window.Halba, e = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    e('div', null,
      e('div', { className: 'stage' },
        e(H.Modal, { contained: true, title: 'Cancel this payment?', onClose: function () {}, id: 'm1',
          footer: [e(H.Button, { key: 'a', variant: 'secondary' }, 'Keep payment'), e(H.Button, { key: 'b' }, 'Cancel payment')] },
          'The customer will not be charged and the order returns to pending.')),
      e('div', { className: 'stage' },
        e(H.Modal, { contained: true, loading: true, title: 'Confirm with your bank', onClose: function () {}, id: 'm2' },
          e('div', { style: { minHeight: 140 } }))))
  );
</script>
