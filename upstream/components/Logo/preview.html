<!-- @dsCard group="Brand" height=520 subtitle="Mark, lockup, tones and sizes" -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 24px; background: var(--surface); font-family: var(--font-sans); color: var(--ink); }
  .row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 32px; margin-bottom: 28px; }
  .cap { font: 500 12px/16px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 12px; }
  .cell { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .block { display: flex; align-items: center; gap: 28px; padding: 20px 24px; border-radius: 16px; }
  .on-brand { background: var(--brand); } .on-ink { background: #0e0e10; }
</style>
<div id="root"></div>
<script>
  var H = window.Halba, e = React.createElement;
  var sizes = [16, 24, 32, 48];
  function cell(label, node) { return e('div', { className: 'cell', key: label }, node, e('span', { className: 'cap', style: { margin: 0 } }, label)); }
  ReactDOM.createRoot(document.getElementById('root')).render(
    e('div', null,
      e('p', { className: 'cap' }, 'Mark, four sizes'),
      e('div', { className: 'row' }, sizes.map(function (s) { return cell(s + ' px', e(H.Logo, { size: s })); })),
      e('p', { className: 'cap' }, 'Lockup, the name always lowercase'),
      e('div', { className: 'row' }, [24, 32, 48].map(function (s) { return cell(s + ' px', e(H.Logo, { variant: 'lockup', size: s })); })),
      e('p', { className: 'cap' }, 'Tones'),
      e('div', { className: 'row' },
        cell('default', e(H.Logo, { variant: 'lockup' })),
        cell('mono', e(H.Logo, { variant: 'lockup', tone: 'mono' }))),
      e('div', { className: 'row' },
        e('div', { className: 'block on-brand' }, e(H.Logo, { variant: 'lockup', tone: 'on-brand' }), e(H.Logo, { tone: 'on-brand', size: 24 })),
        e('div', { className: 'block on-ink', 'data-theme': 'dark' }, e(H.Logo, { variant: 'lockup' }), e(H.Logo, { size: 24 }))))
  );
</script>
