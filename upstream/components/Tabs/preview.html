<!-- @dsCard group="Docs" height=260 subtitle="Underline tabs for content panels" -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 24px; background: var(--surface); font-family: var(--font-sans); color: var(--ink); }
  .cap { font: 500 12px/16px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 12px; }
  .stack { display: flex; flex-direction: column; gap: 28px; max-width: 720px; }
</style>
<div id="root"></div>
<script>
  var H = window.Halba, e = React.createElement;

  function Demo() {
    var s = React.useState('request'), v = s[0], set = s[1];
    return e('div', { className: 'stack' },
      e(H.Tabs, { id: 'demo', label: 'Example', value: v, onChange: set, panelId: 'demo-panel', options: [{ value: 'request', label: 'Request' }, { value: 'response', label: 'Response' }, { value: 'errors', label: 'Errors' }] }),
      e('div', { id: 'demo-panel', role: 'tabpanel', 'aria-labelledby': 'demo-' + v, style: { font: '400 16px/26px var(--font-sans)' } }, v === 'request' ? 'Send the amount in minor units and the three-letter currency.' : v === 'response' ? 'A payment object with its status and the route that was used.' : 'Declines are returned as 402 with a stable code.'));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(e(Demo));
</script>
