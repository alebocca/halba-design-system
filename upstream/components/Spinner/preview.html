<!-- @dsCard group="Feedback" height=360 subtitle="Orbit for short waits, compose for full pages" -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 24px; background: var(--surface); font-family: var(--font-sans); color: var(--ink); }
  .row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 36px; margin-bottom: 28px; }
  .cap { font: 500 12px/16px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 12px; }
  .cell { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .cell .cap { margin: 0; }
  .btn { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 20px; border-radius: 999px; background: var(--brand); color: var(--on-brand); font: 600 15px/20px var(--font-sans); }
</style>
<div id="root"></div>
<script>
  var H = window.Halba, e = React.createElement;
  function cell(label, node) { return e('div', { className: 'cell', key: label }, node, e('span', { className: 'cap' }, label)); }
  ReactDOM.createRoot(document.getElementById('root')).render(
    e('div', null,
      e('p', { className: 'cap' }, 'Orbit, for short waits'),
      e('div', { className: 'row' },
        cell('24 px', e(H.Spinner, null)),
        cell('48 px', e(H.Spinner, { size: 48 })),
        e('span', { className: 'btn' }, e(H.Spinner, { tone: 'mono', size: 20, label: 'Processing' }), 'Processing…')),
      e('p', { className: 'cap' }, 'Compose, for a full page'),
      e('div', { className: 'row' },
        cell('48 px', e(H.Spinner, { variant: 'compose', size: 48 })),
        cell('96 px', e(H.Spinner, { variant: 'compose', size: 96 }))))
  );
</script>
