<style>/* halba-checkout.css — Halba payment page: plain CSS for plain HTML, no React, no external resources.

   One look, four containers: hosted page, modal, embedded in the merchant page, component (methods, card
   fields and button only). Pick the container with a class on the root element:

     <div class="halba-checkout halba-checkout--hosted">   page with the theme background, card ~460px
     <div class="halba-checkout halba-checkout--modal">    dark scrim + dialog, max 500 x 720px, scrolls
     <div class="halba-checkout halba-checkout--embedded"> transparent, height follows the content
     <div class="halba-checkout halba-checkout--component"> same as embedded, inherits the site font
     <div class="halba-checkout halba-checkout--challenge"> 3-D Secure window, about 500 x 640px

   MERCHANT THEME — public variables, set on the root element or on any ancestor (CSSOM
   `el.style.setProperty` or a nonce'd <style>; an inline style="" attribute is blocked by a strict CSP).
   Lengths need a unit: 0px, never 0.

     --halba-primary       any hex             pay button, selected method, focus
     --halba-on-primary    hex                 text on the primary: white or #000, see checkout.md
     --halba-accent        hex                 primary adjusted to 3:1 on the surface: ring, selected edge, radio
     --halba-radius        0px .. 24px         card, fields, button, methods
     --halba-font          font stack          system, Inter or serif stacks in checkout.md
     --halba-bg            hex                 page background, hosted only

   THEME PRESET — set by data-halba-theme="light" | "dark" | "auto" on the root; each can also be overridden:

     --halba-surface --halba-text --halba-muted --halba-border --halba-border-strong --halba-sunken
     --halba-danger --halba-danger-bg --halba-success --halba-success-bg --halba-scrim --halba-shadow

   Every variable has a fallback below, so the page renders with no variable set at all. Inside, the rules
   only read the internal --hc-* copies. */

.halba-checkout {
  --hc-primary: var(--halba-primary, #5b47e0);
  --hc-on-primary: var(--halba-on-primary, #ffffff);
  --hc-accent: var(--halba-accent, var(--hc-primary));
  --hc-radius: var(--halba-radius, 12px);
  --hc-radius-sm: min(var(--hc-radius), 8px);
  --hc-radius-xs: min(var(--hc-radius), 4px);
  --hc-font: var(--halba-font, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif);
  --hc-bg: var(--halba-bg, #f9f9f7);
  --hc-surface: var(--halba-surface, #ffffff);
  --hc-text: var(--halba-text, #0e0e10);
  --hc-muted: var(--halba-muted, #5c5c66);
  --hc-border: var(--halba-border, #deded8);
  --hc-border-strong: var(--halba-border-strong, #8a8a93);
  --hc-sunken: var(--halba-sunken, #efefeb);
  --hc-danger: var(--halba-danger, #b42318);
  --hc-danger-bg: var(--halba-danger-bg, #fde7e4);
  --hc-success: var(--halba-success, #0b7a55);
  --hc-success-bg: var(--halba-success-bg, #ddf5ea);
  --hc-scrim: var(--halba-scrim, rgba(14, 14, 16, 0.55));
  --hc-shadow: var(--halba-shadow, 0 1px 2px rgba(14, 14, 16, 0.06), 0 8px 24px rgba(14, 14, 16, 0.06));
  --hc-shadow-overlay: var(--halba-shadow, 0 2px 4px rgba(14, 14, 16, 0.08), 0 16px 48px rgba(14, 14, 16, 0.18));
}
.halba-checkout[data-halba-theme="dark"] {
  --hc-primary: var(--halba-primary, #a99bff);
  --hc-on-primary: var(--halba-on-primary, #14121f);
  --hc-bg: var(--halba-bg, #0f0f14);
  --hc-surface: var(--halba-surface, #181820);
  --hc-text: var(--halba-text, #f4f4f1);
  --hc-muted: var(--halba-muted, #a8a8b3);
  --hc-border: var(--halba-border, #2c2c36);
  --hc-border-strong: var(--halba-border-strong, #70707c);
  --hc-sunken: var(--halba-sunken, #0a0a0e);
  --hc-danger: var(--halba-danger, #ff8a7d);
  --hc-danger-bg: var(--halba-danger-bg, #3d1a17);
  --hc-success: var(--halba-success, #4fd1a0);
  --hc-success-bg: var(--halba-success-bg, #12332a);
  --hc-scrim: var(--halba-scrim, rgba(0, 0, 0, 0.65));
  --hc-shadow: var(--halba-shadow, 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35));
  --hc-shadow-overlay: var(--halba-shadow, 0 2px 4px rgba(0, 0, 0, 0.5), 0 16px 48px rgba(0, 0, 0, 0.55));
}
@media (prefers-color-scheme: dark) {
  .halba-checkout[data-halba-theme="auto"] {
    --hc-primary: var(--halba-primary, #a99bff);
    --hc-on-primary: var(--halba-on-primary, #14121f);
    --hc-bg: var(--halba-bg, #0f0f14);
    --hc-surface: var(--halba-surface, #181820);
    --hc-text: var(--halba-text, #f4f4f1);
    --hc-muted: var(--halba-muted, #a8a8b3);
    --hc-border: var(--halba-border, #2c2c36);
    --hc-border-strong: var(--halba-border-strong, #70707c);
    --hc-sunken: var(--halba-sunken, #0a0a0e);
    --hc-danger: var(--halba-danger, #ff8a7d);
    --hc-danger-bg: var(--halba-danger-bg, #3d1a17);
    --hc-success: var(--halba-success, #4fd1a0);
    --hc-success-bg: var(--halba-success-bg, #12332a);
    --hc-scrim: var(--halba-scrim, rgba(0, 0, 0, 0.65));
    --hc-shadow: var(--halba-shadow, 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35));
    --hc-shadow-overlay: var(--halba-shadow, 0 2px 4px rgba(0, 0, 0, 0.5), 0 16px 48px rgba(0, 0, 0, 0.55));
  }
}

/* ---------- Base and containers ---------- */
.halba-checkout, .halba-checkout *, .halba-checkout *::before, .halba-checkout *::after { box-sizing: border-box; }
.halba-checkout {
  container: halba-root / inline-size;
  color: var(--hc-text);
  font: 400 16px/24px var(--hc-font);
  -webkit-text-size-adjust: 100%;
  text-align: left;
}
.halba-checkout :where(h1, h2, h3, p, ul, ol, li, dl, dd, figure, fieldset, legend) { margin: 0; padding: 0; }
.halba-checkout :where(fieldset) { border: 0; min-width: 0; }
.halba-checkout :where(ul, ol) { list-style: none; }
.halba-checkout :where(button, input, select) { font: inherit; color: inherit; margin: 0; }
.halba-checkout :where(a) { color: inherit; }
.halba-checkout :where(img, svg) { max-width: 100%; }

.halba-checkout--hosted { min-height: 100vh; min-height: 100dvh; display: flex; align-items: flex-start; justify-content: center; background: var(--hc-bg); }
/* spacing lives on the card: a container query cannot restyle the container itself */
.halba-checkout--hosted > .halba-card { max-width: 460px; width: calc(100% - 32px); margin: 48px 0; }
.halba-checkout--modal, .halba-checkout--challenge { position: fixed; inset: 0; z-index: 2147483000; display: flex; align-items: center; justify-content: center; background: var(--hc-scrim); }
.halba-checkout--contained { position: absolute; inset: 0; z-index: 1; }
.halba-checkout--hosted.halba-checkout--contained { position: relative; min-height: 0; }
.halba-checkout--modal > .halba-card { width: calc(100% - 32px); max-width: 500px; max-height: min(720px, calc(100% - 32px)); overflow-y: auto; overscroll-behavior: contain; box-shadow: var(--hc-shadow-overlay); }
.halba-checkout--embedded, .halba-checkout--component { background: transparent; }
.halba-checkout--component { --hc-font: var(--halba-font, inherit); }
.halba-checkout--embedded > .halba-card, .halba-checkout--component > .halba-card { background: transparent; border: 0; box-shadow: none; padding: 0; border-radius: 0; }

.halba-card {
  container: halba / inline-size;
  position: relative; display: flex; flex-direction: column; gap: 24px; width: 100%;
  padding: 28px; background: var(--hc-surface); border: 1px solid var(--hc-border);
  border-radius: var(--hc-radius); box-shadow: var(--hc-shadow);
}
.halba-card--status { align-items: center; text-align: center; gap: 16px; padding-top: 40px; padding-bottom: 32px; }

@container halba-root (max-width: 520px) {
  .halba-checkout--hosted > .halba-card { max-width: none; width: 100%; margin: 0; min-height: 100vh; min-height: 100dvh; border-width: 0; border-radius: 0; box-shadow: none; }
  .halba-checkout--modal > .halba-card { align-self: flex-end; max-width: none; width: 100%; max-height: 92%; border-radius: var(--hc-radius) var(--hc-radius) 0 0; }
}
@container halba (max-width: 400px) {
  .halba-card:not(.halba-card--flush) { padding: 20px; }
}

/* ---------- Header, amount, summary ---------- */
.halba-close { position: absolute; top: 12px; right: 12px; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: var(--hc-radius-sm); background: transparent; color: var(--hc-muted); cursor: pointer; }
.halba-close:hover { background: var(--hc-sunken); color: var(--hc-text); }
.halba-header { display: flex; align-items: center; gap: 12px; min-height: 32px; }
.halba-checkout--modal .halba-header { padding-right: 40px; }
.halba-logo { display: block; flex: none; height: 32px; width: auto; max-width: 140px; object-fit: contain; }
.halba-shop { flex: 1; min-width: 0; font-size: 16px; line-height: 20px; font-weight: 600; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }

.halba-amount { display: flex; flex-direction: column; gap: 4px; }
.halba-amount__label { font-size: 14px; line-height: 20px; color: var(--hc-muted); }
.halba-amount__value { font-size: 40px; line-height: 44px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
@container halba (max-width: 400px) { .halba-amount__value { font-size: 34px; line-height: 40px; } }

.halba-summary { border-top: 1px solid var(--hc-border); border-bottom: 1px solid var(--hc-border); }
.halba-summary__toggle { display: flex; align-items: center; gap: 8px; min-height: 48px; cursor: pointer; font-size: 14px; line-height: 20px; font-weight: 600; list-style: none; }
.halba-summary__toggle::-webkit-details-marker { display: none; }
.halba-summary__toggle:focus-visible { outline: 3px solid var(--hc-accent); outline-offset: 2px; border-radius: var(--hc-radius-xs); }
.halba-summary__count { flex: 1; font-weight: 400; color: var(--hc-muted); }
.halba-summary__toggle .halba-icon { width: 18px; height: 18px; color: var(--hc-muted); transition: transform 0.2s ease-out; }
.halba-summary[open] .halba-summary__toggle .halba-icon { transform: rotate(180deg); }
.halba-lines { display: flex; flex-direction: column; gap: 8px; padding: 4px 0 12px; }
.halba-line { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; font-size: 14px; line-height: 20px; }
.halba-line__name { min-width: 0; overflow-wrap: anywhere; }
.halba-line__qty { color: var(--hc-muted); white-space: nowrap; }
.halba-line__price { flex: none; font-variant-numeric: tabular-nums; }
.halba-line--muted { color: var(--hc-muted); }
.halba-total { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 12px 0 14px; border-top: 1px solid var(--hc-border); font-size: 16px; line-height: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- Methods: a radio group where the checked one opens (CSS only) ---------- */
.halba-form { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.halba-methods__title { display: block; width: 100%; margin-bottom: 12px; font-size: 14px; line-height: 20px; font-weight: 600; }
.halba-methods__list { display: flex; flex-direction: column; gap: 8px; }

.halba-method { position: relative; background: var(--hc-surface); border: 1.5px solid var(--hc-border); border-radius: var(--hc-radius); transition: border-color 0.15s ease-out; }
.halba-method:hover { border-color: var(--hc-border-strong); }
.halba-method:has(.halba-method__input:checked) { border-color: var(--hc-accent); box-shadow: inset 0 0 0 1px var(--hc-accent); }
@supports (background: color-mix(in srgb, red, blue)) {
  .halba-method:has(.halba-method__input:checked) { background: color-mix(in srgb, var(--hc-accent) 6%, var(--hc-surface)); }
}
.halba-method__input { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); border: 0; opacity: 0; }
.halba-method__label { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 16px; cursor: pointer; border-radius: var(--hc-radius); }
.halba-method__input:focus-visible + .halba-method__label { outline: 3px solid var(--hc-accent); outline-offset: 2px; }
.halba-method__radio { flex: none; width: 20px; height: 20px; border: 2px solid var(--hc-border-strong); border-radius: 50%; background: var(--hc-surface); }
.halba-method__input:checked + .halba-method__label .halba-method__radio { border-color: var(--hc-accent); background: var(--hc-accent); box-shadow: inset 0 0 0 3px var(--hc-surface); }
.halba-method__logo { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 28px; color: var(--hc-text); }
.halba-method__logo img { display: block; max-height: 28px; width: auto; }
.halba-method__text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.halba-method__name { font-size: 16px; line-height: 24px; font-weight: 600; overflow-wrap: anywhere; }
.halba-method__hint { font-size: 14px; line-height: 20px; color: var(--hc-muted); overflow-wrap: anywhere; }
.halba-method__aside { flex: none; display: inline-flex; align-items: center; gap: 4px; }
@container halba (max-width: 360px) {
  .halba-method__aside .halba-brand:nth-child(n+3) { display: none; }
  .halba-method__label { padding-left: 12px; padding-right: 12px; gap: 10px; }
}

.halba-method__panel { display: grid; grid-template-rows: 0fr; visibility: hidden; transition: grid-template-rows 0.2s ease-out, visibility 0.2s; }
.halba-method__input:checked ~ .halba-method__panel { grid-template-rows: 1fr; visibility: visible; }
.halba-method__panel-inner { min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 0 16px; }
.halba-method__input:checked ~ .halba-method__panel .halba-method__panel-inner { padding: 4px 16px 16px; }
.halba-note { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 20px; color: var(--hc-muted); }
.halba-note .halba-icon { width: 18px; height: 18px; margin-top: 1px; }

/* ---------- Card schemes ---------- */
/* The networks enabled for the online channel by the connected PSPs. Official artwork only (checkout/brands/), one chip size for all,
   equal prominence. Markup: <div class="halba-brands" role="group" aria-labelledby="id"><span class="halba-brands__label" id="id">We accept</span>
   <ul class="halba-brands__list"><li class="halba-brand halba-brand--visa"><img class="halba-brand__img halba-brand__img--on-light" src alt="Visa">
   <img class="halba-brand__img halba-brand__img--on-dark" src alt=""></li>...</ul></div>. Only Visa has a negative (white) file; see checkout.md. */
.halba-brands { display: block; max-width: 100%; margin-bottom: 4px; }
.halba-brands__label { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.halba-brands__list { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start; gap: 6px 4px; margin: 0; padding: 0; list-style: none; }
/* Framed marks: every scheme in the same 40 x 26 chip, whatever the shape of its artwork (Amex is square, Visa is a strip). One row above the card number,
   aligned left. Decision of Halba: Cartes Bancaires is scaled like the others, below the 52.2 x 37.8 px minimum of its charte (see checkout.md). */
.halba-brand { box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; flex: none; width: 40px; height: 26px; padding: 4px; border: 1px solid var(--hc-border); border-radius: var(--hc-radius-xs); background: var(--hc-surface); color: var(--hc-text); font-size: 11px; line-height: 14px; font-weight: 700; }
.halba-brand--text { width: auto; min-width: 40px; padding: 0 6px; }
.halba-brand__img { display: block; width: auto; height: auto; max-width: 100%; max-height: 100%; }
.halba-brand--visa .halba-brand__img { width: 30px; }
.halba-brand--mastercard .halba-brand__img { width: 26px; }
.halba-brand--amex .halba-brand__img { width: 18px; }
.halba-brand--discover .halba-brand__img { width: 28px; }
.halba-brand--jcb .halba-brand__img { width: 24px; }
.halba-brand--unionpay .halba-brand__img { width: 29px; }
.halba-brand--cartes-bancaires .halba-brand__img { width: 26px; }
.halba-brand--maestro .halba-brand__img { width: 26px; }
.halba-brand--diners .halba-brand__img { width: 20px; }
/* The scheme recognised from the number, inside the field: the same logo, bigger, no frame (the field is the frame) */
.halba-control__trail .halba-brand { width: auto; height: auto; padding: 0; border: 0; background: none; }
.halba-control__trail .halba-brand--active { box-shadow: none; }
.halba-control__trail .halba-brand--visa .halba-brand__img { width: 38px; }
.halba-control__trail .halba-brand--mastercard .halba-brand__img { width: 34px; }
.halba-control__trail .halba-brand--amex .halba-brand__img { width: 26px; }
.halba-control__trail .halba-brand--discover .halba-brand__img { width: 34px; }
.halba-control__trail .halba-brand--jcb .halba-brand__img { width: 32px; }
.halba-control__trail .halba-brand--unionpay .halba-brand__img { width: 36px; }
.halba-control__trail .halba-brand--cartes-bancaires .halba-brand__img { width: 32px; }
.halba-control__trail .halba-brand--maestro .halba-brand__img { width: 34px; }
.halba-control__trail .halba-brand--diners .halba-brand__img { width: 26px; }
.halba-brand__img--on-dark { display: none; }
.halba-checkout[data-halba-theme="dark"] .halba-brand__img--on-light:not(:only-of-type) { display: none; }
.halba-checkout[data-halba-theme="dark"] .halba-brand__img--on-dark { display: block; }
@media (prefers-color-scheme: dark) {
  .halba-checkout[data-halba-theme="auto"] .halba-brand__img--on-light:not(:only-of-type) { display: none; }
  .halba-checkout[data-halba-theme="auto"] .halba-brand__img--on-dark { display: block; }
}
.halba-brand--active { border-color: var(--hc-accent); box-shadow: 0 0 0 1px var(--hc-accent); }
@media (forced-colors: active) { .halba-brand { border-color: CanvasText; } .halba-brand--active { border-width: 2px; } }

/* Co-badged card: the payer chooses the network (Regulation (EU) 2015/751, Art. 8).
   It sits inside the card panel, right under the card number, and only exists for a co-badged card. The merchant may
   preselect one network, the payer can change it before paying. Both options have the same weight: the only difference
   is the selected state. No "recommended" label, no other colour.
   Markup (the wrapper stays in the DOM; JavaScript only sets data-open and swaps the body):
   <div class="halba-network" data-open="true">
     <p class="halba-sr" role="status">Your card has two networks: Cartes Bancaires and Visa. Cartes Bancaires is selected.</p>
     <div class="halba-network__inner"><fieldset class="halba-cobrand" aria-describedby="id-h">
       <legend class="halba-cobrand__legend">Pay with</legend>
       <div class="halba-cobrand__opts">
         <label class="halba-cobrand__opt"><input type="radio" name="network" value="cartes-bancaires" checked>
           <span class="halba-brand halba-brand--cartes-bancaires">...</span><span class="halba-cobrand__name">Cartes Bancaires</span></label>
         <label class="halba-cobrand__opt">...Visa...</label></div>
       <p class="halba-cobrand__hint" id="id-h">You can change this before you pay.</p></fieldset></div></div>
   Checking (number complete, about 1 s): same wrapper, aria-busy="true", inner holds .halba-network__skel instead of the fieldset.
   Failed check: inner holds <p class="halba-note" role="status"> and the page pays with the card's main network. */
.halba-network { display: grid; grid-template-rows: 0fr; margin-bottom: -16px; }
.halba-network[data-open="true"] { grid-template-rows: 1fr; margin-bottom: 0; }
.halba-network__inner { min-height: 0; overflow: hidden; margin: -4px; padding: 4px; visibility: hidden; }
.halba-network[data-open="true"] .halba-network__inner { visibility: visible; }
@media (prefers-reduced-motion: no-preference) {
  .halba-network { transition: grid-template-rows 0.22s ease, margin-bottom 0.22s ease; }
  .halba-network__inner { transition: visibility 0s linear 0.22s; }
  .halba-network[data-open="true"] .halba-network__inner { transition-delay: 0s; }
}
.halba-sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.halba-cobrand, .halba-network__skel { display: grid; gap: 8px; margin: 0; padding: 0; border: 0; min-width: 0; min-height: 132px; align-content: start; }
.halba-cobrand__legend { padding: 0; font-size: 14px; line-height: 20px; font-weight: 600; }
.halba-cobrand__opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.halba-cobrand__opt {
  display: grid; grid-template-columns: auto 1fr; grid-template-areas: "radio logo" "name name"; align-items: center; column-gap: 10px; row-gap: 4px;
  box-sizing: border-box; min-height: 76px; padding: 10px 12px; border: 1px solid var(--hc-border-strong); border-radius: var(--hc-radius); background: var(--hc-surface); cursor: pointer;
}
.halba-cobrand__opt input { grid-area: radio; appearance: none; -webkit-appearance: none; box-sizing: border-box; width: 20px; height: 20px; margin: 0; border: 2px solid var(--hc-border-strong); border-radius: 50%; background: var(--hc-surface); }
.halba-cobrand__opt input:checked { border-color: var(--hc-accent); background: var(--hc-accent); box-shadow: inset 0 0 0 3px var(--hc-surface); }
